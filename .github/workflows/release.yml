# Every merge to main: test, build a signed release APK, send it to the Family testers in
# Firebase App Tester. Release notes come from the merged commit.
#
# Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  JSON key of github-release@daurfit (role: Firebase App Distribution Admin only)
#   APPCHECK_DEBUG_TOKEN      App Check token, so the AI meal estimate works in these builds
#   ANDROID_SIGNING_KEYSTORE  base64 of the Mac's ~/.android/debug.keystore (SHA-1 73:b4:b3:…:91:5a). Must be
#                             that key: Google sign-in only works for keys registered in Firebase, and
#                             an installed build only updates with the same key (a different one makes
#                             App Tester uninstall first, wiping the app's data). Check a build with
#                             apksigner verify --print-certs app-release.apk
name: Release to App Tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false # never drop a release half-way

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Account cleanup function tests
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Firestore access rules (local emulator only)
        shell: bash
        run: |
          RULES_DIR=$(mktemp -d)
          cp test/firestore_rules.test.mjs "$RULES_DIR/"
          printf '%s' '{"emulators":{"firestore":{"host":"127.0.0.1","port":8085},"ui":{"enabled":false}}}' > "$RULES_DIR/firebase.json"
          cd "$RULES_DIR"
          npm install --no-audit --no-fund --save-exact @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.17.0
          RULES="$GITHUB_WORKSPACE/firestore.rules" ./node_modules/.bin/firebase emulators:exec --only firestore --project daur-rules-test "node firestore_rules.test.mjs"

  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Signing key (the same one the installed builds use)
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing family signing key"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build the release APK
        env:
          TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "Missing family App Check token"; exit 1; }
          printf '{"APPCHECK_DEBUG_TOKEN": "%s"}' "$TOKEN" > dart_defines.json
          # 100 + commits on main: always higher than the last build, the same rule as release.sh
          BUILD=$((100 + $(git rev-list --count HEAD)))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          flutter build apk --release --build-number="$BUILD" --dart-define-from-file=dart_defines.json

      - name: Release notes from the merged commit
        run: |
          {
            git log -1 --pretty=%B | sed '/^Merge pull request/d; /^Co-Authored-By/d; /^$/d' | head -6
            echo
            echo "Build $BUILD · ${GITHUB_SHA::7}"
          } > release-notes.txt
          cat release-notes.txt

      - name: Send to App Tester (Family)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@14.17.0 \
            appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:179925532044:android:6756796d5a2804a454aaa9 \
            --groups family \
            --release-notes-file release-notes.txt \
            --project daurfit
          rm -f "$RUNNER_TEMP/sa.json"
